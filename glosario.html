<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glosario — Formación Docente en Pedagogía Innovadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #1A6B68;
    --brand-dark: #12504D;
    --brand-light: #E8F4F3;
    --brand-mid: #2A8A87;
    --steam: #07B0E4;
    --steam-bg: #E6F7FD;
    --steam-text: #055E78;
    --abp: #2BA848;
    --abp-bg: #E8F7EB;
    --abp-text: #155A24;
    --dt: #E83C8D;
    --dt-bg: #FDEAF3;
    --dt-text: #7A1447;
    --eval: #E9A037;
    --eval-bg: #FDF3E3;
    --eval-text: #7A4E0A;
    --cts: #7C3AED;
    --cts-bg: #F0EBFD;
    --cts-text: #3D1A7A;
    --story: #F59E0B;
    --story-bg: #FEF3DC;
    --story-text: #7A4E00;
    --gray-50: #F8F9FA;
    --gray-100: #F1F3F5;
    --gray-200: #E9ECEF;
    --gray-300: #DEE2E6;
    --gray-400: #CED4DA;
    --gray-500: #ADB5BD;
    --gray-600: #6C757D;
    --gray-700: #495057;
    --gray-800: #343A40;
    --gray-900: #212529;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--gray-800);
    background: var(--gray-50);
    min-height: 100vh;
  }

  /* HEADER */
  .site-header {
    background: var(--brand);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    gap: 1rem;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    color: white;
    flex-shrink: 0;
  }

  .header-logo {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .header-title {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    font-size: 0.75rem;
    opacity: 0.75;
    font-weight: 400;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .btn-back {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.4rem 0.75rem;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.25);
    transition: all 0.15s;
  }
  .btn-back:hover { background: rgba(255,255,255,0.1); color: white; }

  .btn-print {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 0.4rem 0.75rem;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .btn-print:hover { background: rgba(255,255,255,0.25); }

  /* MAIN */
  .main-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* PAGE INTRO */
  .page-intro {
    margin-bottom: 2rem;
  }
  .page-intro h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--gray-900);
    letter-spacing: -0.02em;
    margin-bottom: 0.4rem;
  }
  .page-intro p {
    color: var(--gray-600);
    font-size: 0.95rem;
  }

  /* SEARCH */
  .search-wrapper {
    position: relative;
    margin-bottom: 1.25rem;
  }
  .search-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray-500);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    border: 1.5px solid var(--gray-300);
    border-radius: var(--radius-md);
    background: white;
    color: var(--gray-800);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    box-shadow: var(--shadow-sm);
  }
  #searchInput:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(26,107,104,0.12);
  }
  #searchInput::placeholder { color: var(--gray-500); }

  .clear-btn {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--gray-400);
    padding: 0.25rem;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }
  .clear-btn:hover { color: var(--gray-700); }
  .clear-btn.visible { display: flex; }

  /* FILTER CHIPS */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    user-select: none;
    background: white;
    color: var(--gray-600);
    border-color: var(--gray-300);
  }
  .chip:hover { border-color: var(--gray-400); color: var(--gray-800); }

  .chip.active[data-filter="all"] { background: var(--brand); color: white; border-color: var(--brand); }
  .chip.active[data-filter="steam"] { background: var(--steam); color: white; border-color: var(--steam); }
  .chip.active[data-filter="abp"] { background: var(--abp); color: white; border-color: var(--abp); }
  .chip.active[data-filter="dt"] { background: var(--dt); color: white; border-color: var(--dt); }
  .chip.active[data-filter="eval"] { background: var(--eval); color: white; border-color: var(--eval); }
  .chip.active[data-filter="cts"] { background: var(--cts); color: white; border-color: var(--cts); }
  .chip.active[data-filter="story"] { background: var(--story); color: white; border-color: var(--story); }
  .chip.active[data-filter="crea"] { background: #E83C8D; color: white; border-color: #E83C8D; }
  .chip.active[data-filter="tec"] { background: #7C3AED; color: white; border-color: #7C3AED; }
  .chip.active[data-filter="ml"] { background: #F59E0B; color: white; border-color: #F59E0B; }
  .chip.active[data-filter="flip"] { background: #EF4444; color: white; border-color: #EF4444; }
  .chip.active[data-filter="abv"] { background: #6366F1; color: white; border-color: #6366F1; }
  .chip.active[data-filter="micro"] { background: #F97316; color: white; border-color: #F97316; }

  .chip-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ALPHA INDEX */
  .alpha-index {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    margin-bottom: 2rem;
    padding: 0.875rem 1rem;
    background: white;
    border-radius: var(--radius-md);
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow-sm);
  }
  .alpha-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: none;
    background: none;
    color: var(--gray-500);
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .alpha-btn:hover { background: var(--brand-light); color: var(--brand); }
  .alpha-btn.has-terms { color: var(--gray-700); }
  .alpha-btn.has-terms:hover { background: var(--brand-light); color: var(--brand); }
  .alpha-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  /* COUNT BADGE */
  .count-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .count-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--brand-light);
    color: var(--brand-dark);
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
  }

  /* TERMS LIST */
  #termsContainer { }

  .letter-section { margin-bottom: 2.5rem; }

  .letter-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .letter-badge {
    width: 40px;
    height: 40px;
    background: var(--brand);
    color: white;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .letter-line {
    flex: 1;
    height: 1px;
    background: var(--gray-200);
  }

  .term-card {
    background: white;
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem;
    margin-bottom: 0.75rem;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .term-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--gray-300);
  }

  .term-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 0.6rem;
    flex-wrap: wrap;
  }

  .term-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--gray-900);
    letter-spacing: -0.01em;
    flex: 1;
    min-width: 200px;
  }

  .term-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    flex-shrink: 0;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .tag-steam { background: var(--steam-bg); color: var(--steam-text); }
  .tag-abp { background: var(--abp-bg); color: var(--abp-text); }
  .tag-dt { background: var(--dt-bg); color: var(--dt-text); }
  .tag-eval { background: var(--eval-bg); color: var(--eval-text); }
  .tag-cts { background: var(--cts-bg); color: var(--cts-text); }
  .tag-story { background: var(--story-bg); color: var(--story-text); }
  .tag-crea { background: #FCE7F3; color: #BE185D; }
  .tag-tec { background: #EDE9FE; color: #6D28D9; }
  .tag-ml { background: #FEF3C7; color: #B45309; }
  .tag-flip { background: #FEE2E2; color: #B91C1C; }
  .tag-abv { background: #E0E7FF; color: #4338CA; }
  .tag-micro { background: #FFEDD5; color: #C2410C; }
  .tag-iaf { background: #D1FAE5; color: #065F46; }
  .tag-iat { background: #FFEDD5; color: #9A3412; }
  .tag-iah { background: #EDE9FE; color: #5B21B6; }
  .tag-iai { background: #CFFAFE; color: #0E7490; }
  .tag-iac { background: #FCE7F3; color: #9D174D; }
  .tag-mjc { background: #CFFAFE; color: #155E75; }
  .tag-sel { background: #FCE7F3; color: #BE185D; }
  .tag-com { background: #EDE9FE; color: #5B21B6; }
  .tag-dis { background: #FFEDD5; color: #9A3412; }
  .tag-bie { background: #DCFCE7; color: #166534; }
.tag-ei { background: #EDE9FE; color: #4C1D95; }
.tag-tea { background: #E0E7FF; color: #3730A3; }
.tag-ddt { background: #FEF3C7; color: #92400E; }
.tag-lsg { background: #E0F2FE; color: #075985; }

  .term-definition {
    color: var(--gray-700);
    font-size: 0.92rem;
    line-height: 1.65;
    margin-bottom: 0.75rem;
  }

  .term-classroom {
    display: flex;
    gap: 0.6rem;
    background: var(--gray-50);
    border-left: 3px solid var(--brand);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 0.6rem 0.875rem;
    font-size: 0.88rem;
    color: var(--gray-700);
    line-height: 1.55;
  }
  .term-classroom-label {
    font-weight: 700;
    color: var(--brand-dark);
    flex-shrink: 0;
  }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--gray-500);
  }
  .no-results svg { margin-bottom: 1rem; opacity: 0.4; }
  .no-results p { font-size: 1rem; }
  .no-results span { font-size: 0.875rem; color: var(--gray-400); }

  /* FOOTER */
  .site-footer {
    background: var(--gray-900);
    color: var(--gray-400);
    text-align: center;
    padding: 1.5rem;
    font-size: 0.83rem;
  }
  .site-footer strong { color: white; }

  /* HIGHLIGHT */
  mark {
    background: rgba(26,107,104,0.15);
    color: var(--brand-dark);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* PRINT */
  @media print {
    .site-header { position: static; box-shadow: none; }
    .btn-print, .btn-back, .search-wrapper, .filter-row, .alpha-index, .count-bar { display: none !important; }
    .term-card { break-inside: avoid; box-shadow: none; border: 1px solid #ccc; }
    .letter-section { break-inside: avoid; }
    body { background: white; }
    .site-footer { background: none; color: #666; }
  }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .header-inner { padding: 0 1rem; }
    .header-subtitle { display: none; }
    .main-container { padding: 1.25rem 1rem 3rem; }
    .page-intro h1 { font-size: 1.4rem; }
    .term-header { flex-direction: column; gap: 0.5rem; }
    .term-tags { order: -1; }
    .alpha-btn { width: 28px; height: 28px; font-size: 0.75rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <div class="header-logo">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 10L10 3L17 10" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 8V16H15V8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 16V12H12V16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Pedagogía Innovadora</div>
        <div class="header-subtitle">Guatemala</div>
      </div>
    </a>
    <div class="header-actions">
      <a href="index.html" class="btn-back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Volver a la plataforma
      </a>
      <button class="btn-print" onclick="window.print()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="5" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M4 5V2H10V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 9H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4 11H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Imprimir
      </button>
    </div>
  </div>
</header>

<main class="main-container">
  <div class="page-intro">
    <h1>Glosario de Pedagogía Innovadora</h1>
    <p>Referencia de términos clave para los cursos de Formación Docente — 95 conceptos organizados alfabéticamente.</p>
  </div>

  <div class="search-wrapper">
    <span class="search-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.75"/><path d="M12.5 12.5L16 16" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </span>
    <input type="text" id="searchInput" placeholder="Buscar términos o definiciones..." autocomplete="off" spellcheck="false">
    <button class="clear-btn" id="clearBtn" aria-label="Limpiar búsqueda">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="chip active" data-filter="all">
      <svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor" opacity="0.5"/></svg>
      Todos
    </button>
    <button class="chip" data-filter="steam">
      <span class="chip-dot" style="background:#07B0E4"></span>STEAM
    </button>
    <button class="chip" data-filter="abp">
      <span class="chip-dot" style="background:#2BA848"></span>ABP
    </button>
    <button class="chip" data-filter="dt">
      <span class="chip-dot" style="background:#E83C8D"></span>Design Thinking
    </button>
    <button class="chip" data-filter="eval">
      <span class="chip-dot" style="background:#E9A037"></span>Evaluación
    </button>
    <button class="chip" data-filter="cts">
      <span class="chip-dot" style="background:#7C3AED"></span>Conoce a tus Estudiantes
    </button>
    <button class="chip" data-filter="story">
      <span class="chip-dot" style="background:#F59E0B"></span>Storytelling
    </button>
    <button class="chip" data-filter="crea">
      <span class="chip-dot" style="background:#E83C8D"></span>Creatividad
    </button>
    <button class="chip" data-filter="tec">
      <span class="chip-dot" style="background:#7C3AED"></span>Herramientas Tec.
    </button>
    <button class="chip" data-filter="ml">
      <span class="chip-dot" style="background:#F59E0B"></span>Mobile Learning
    </button>
    <button class="chip" data-filter="flip">
      <span class="chip-dot" style="background:#EF4444"></span>Aula Invertida
    </button>
    <button class="chip" data-filter="abv">
      <span class="chip-dot" style="background:#6366F1"></span>Videos (ABV)
    </button>
    <button class="chip" data-filter="micro">
      <span class="chip-dot" style="background:#F97316"></span>Micro-learning
    </button>
    <button class="chip" data-filter="iaf">
      <span class="chip-dot" style="background:#10B981"></span>Docente y la IA
    </button>
    <button class="chip" data-filter="iat">
      <span class="chip-dot" style="background:#F97316"></span>IA: Ahorro de Tiempo
    </button>
    <button class="chip" data-filter="iah">
      <span class="chip-dot" style="background:#8B5CF6"></span>Herramientas de IA
    </button>
    <button class="chip" data-filter="iai">
      <span class="chip-dot" style="background:#06B6D4"></span>IA e Inclusión
    </button>
    <button class="chip" data-filter="iac">
      <span class="chip-dot" style="background:#EC4899"></span>Ciudadanía Digital IA
    </button>
    <button class="chip" data-filter="mjc">
      <span class="chip-dot" style="background:#0891B2"></span>Conductas Desafiantes
    </button>
    <button class="chip" data-filter="sel">
      <span class="chip-dot" style="background:#DB2777"></span>SEL Docentes
    </button>
    <button class="chip" data-filter="com">
      <span class="chip-dot" style="background:#7C3AED"></span>Comunicación Asertiva
    </button>
    <button class="chip" data-filter="dis">
      <span class="chip-dot" style="background:#EA580C"></span>Disciplina Positiva
    </button>
    <button class="chip" data-filter="bie">
      <span class="chip-dot" style="background:#16A34A"></span>Bienestar Docente
    </button>
    <button class="chip" data-filter="ei">
      <span class="chip-dot" style="background:#8B5CF6"></span>Educación Inclusiva
    </button>
    <button class="chip" data-filter="tea">
      <span class="chip-dot" style="background:#6366F1"></span>TEA
    </button>
    <button class="chip" data-filter="ddt">
      <span class="chip-dot" style="background:#F59E0B"></span>Down y TDAH
    </button>

const ALL_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let activeFilter = 'all';
let activeSearch = '';

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  if (!query.trim()) return escaped;
  const re = new RegExp('(' + query.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function buildTagHtml(courses) {
  return courses.map(c => {
    const info = COURSES[c];
    return info ? `<span class="tag ${info.cls}">${escapeHtml(info.label)}</span>` : '';
  }).join('');
}

function renderTerms() {
  const query = activeSearch.toLowerCase().trim();
  const filtered = terms.filter(t => {
    const matchCourse = activeFilter === 'all' || t.courses.includes(activeFilter);
    const matchSearch = !query ||
      t.term.toLowerCase().includes(query) ||
      t.definition.toLowerCase().includes(query) ||
      t.classroom.toLowerCase().includes(query) ||
      t.courses.some(c => COURSES[c] && COURSES[c].label.toLowerCase().includes(query));
    return matchCourse && matchSearch;
  });

  const countBadge = document.getElementById('countBadge');
  countBadge.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="1" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M4 6.5H9M6.5 4V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> ${filtered.length} término${filtered.length !== 1 ? 's' : ''} encontrado${filtered.length !== 1 ? 's' : ''}`;

  const container = document.getElementById('termsContainer');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="no-results">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="22" cy="22" r="14" stroke="currentColor" stroke-width="2.5"/>
        <path d="M32 32L42 42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M17 22H27M22 17V27" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      </svg>
      <p>No se encontraron términos</p>
      <span>Intenta con otra palabra o cambia el filtro</span>
    </div>`;
    updateAlphaIndex([]);
    return;
  }

  const byLetter = {};
  filtered.forEach(t => {
    if (!byLetter[t.letter]) byLetter[t.letter] = [];
    byLetter[t.letter].push(t);
  });
  // Orden alfabético dentro de cada letra
  Object.keys(byLetter).forEach(l => byLetter[l].sort((a, b) => a.term.localeCompare(b.term, 'es')));

  const letters = Object.keys(byLetter).sort();
  updateAlphaIndex(letters);

  const html = letters.map(letter => {
    const cards = byLetter[letter].map(t => `
      <div class="term-card">
        <div class="term-header">
          <div class="term-name">${highlight(t.term, activeSearch)}</div>
          <div class="term-tags">${buildTagHtml(t.courses)}</div>
        </div>
        <div class="term-definition">${highlight(t.definition, activeSearch)}</div>
        <div class="term-classroom">
          <span class="term-classroom-label">En el aula:</span>
          <span>${highlight(t.classroom, activeSearch)}</span>
        </div>
      </div>`).join('');

    return `<div class="letter-section" id="section-${letter}">
      <div class="letter-header">
        <div class="letter-badge">${letter}</div>
        <div class="letter-line"></div>
      </div>
      ${cards}
    </div>`;
  }).join('');

  container.innerHTML = html;
}

function updateAlphaIndex(activeLetters) {
  const index = document.getElementById('alphaIndex');
  index.innerHTML = ALL_LETTERS.map(l => {
    const has = activeLetters.includes(l);
    return `<button class="alpha-btn${has ? ' has-terms' : ' disabled'}" ${has ? `onclick="scrollToLetter('${l}')"` : 'disabled'} title="${l}">${l}</button>`;
  }).join('');
}

function scrollToLetter(letter) {
  const el = document.getElementById('section-' + letter);
  if (el) {
    const offset = 80;
    const top = el.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top, behavior: 'smooth' });
  }
}

// Search
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

searchInput.addEventListener('input', e => {
  activeSearch = e.target.value;
  clearBtn.classList.toggle('visible', activeSearch.length > 0);
  renderTerms();
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  activeSearch = '';
  clearBtn.classList.remove('visible');
  searchInput.focus();
  renderTerms();
});

// Prellenar búsqueda desde ?q= (link directo desde la búsqueda global de la app)
(function () {
  const q = new URLSearchParams(location.search).get('q');
  if (q) {
    searchInput.value = q;
    activeSearch = q;
    clearBtn.classList.add('visible');
    renderTerms();
  }
})();

// Filter chips
document.getElementById('filterRow').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  renderTerms();
});

// Initial render
renderTerms();
</script>
</body>
</html>
